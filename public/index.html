<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Lost & Found Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Login View -->
        <div id="login-view" class="view active">
            <div class="glass-card auth-card">
                <div class="logo">🔍</div>
                <h1>Welcome Back</h1>
                <p>Lost & Found Tracker</p>
                <form id="login-form">
                    <div class="input-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" required placeholder="Enter your username">
                    </div>
                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required placeholder="Enter your password">
                    </div>
                    <div id="login-error" class="error-msg"></div>
                    <button type="submit" class="btn primary-btn">Login</button>
                    <div class="auth-toggle">
                        Don't have an account? <span id="show-register">Register here</span>
                    </div>
                </form>
            </div>
        </div>

        <!-- Register View -->
        <div id="register-view" class="view">
            <div class="glass-card auth-card">
                <div class="logo">✨</div>
                <h1>Create Account</h1>
                <p>Join the community</p>
                <form id="register-form">
                    <div class="input-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" required placeholder="Choose a username">
                    </div>
                    <div class="input-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" required placeholder="Your email address">
                    </div>
                    <div class="input-group">
                        <label for="reg-phone">Phone Number</label>
                        <input type="text" id="reg-phone" required placeholder="Your phone number">
                    </div>
                    <div class="input-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" required placeholder="Create a password">
                    </div>
                    <div class="input-group">
                        <label for="reg-role">Role</label>
                        <select id="reg-role" required>
                            <option value="STUDENT">Student</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>
                    <div id="register-error" class="error-msg"></div>
                    <button type="submit" class="btn primary-btn">Register</button>
                    <div class="auth-toggle">
                        Already have an account? <span id="show-login">Login here</span>
                    </div>
                </form>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="view">
            <nav class="glass-nav">
                <div class="nav-brand">🔍 FindStuff</div>
                <div class="nav-user">
                    <span id="user-greeting" class="user-greeting">Hello, User</span>
                    <button id="logout-btn" class="btn outline-btn">Logout</button>
                </div>
            </nav>
            
            <main class="dashboard-content">
                <div class="header-actions">
                    <h2>Lost & Found Items</h2>
                    <div class="search-container">
                        <input type="text" id="search-input" placeholder="Search items, categories, or tracking #..." class="search-input">
                    </div>
                </div>
                
                <div class="items-grid" id="items-grid">
                    <!-- Items will be injected here via JS -->
                </div>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
